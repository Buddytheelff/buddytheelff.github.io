<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Management - Project</title>
  <style>
    /* Reset margins and force full-height viewer */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: sans-serif;
      background-color: #1a202c;
    }

    /* Container holding the PDF and top toolbar */
    .resume-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Minimal top bar with a direct download button */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1.5rem;
      background-color: #2d3748;
      color: #ffffff;
    }

    .download-btn {
      background-color: #3182ce;
      color: #ffffff;
      padding: 0.5rem 1rem;
      text-decoration: none;
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: background-color 0.2s ease;
    }

    .download-btn:hover {
      background-color: #2b6cb0;
    }

    /* Embed element filling remaining screen space */
    .pdf-viewer {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="resume-container">
    <header class="top-bar">
      <h2>Buddy Collins - Project Manager</h2>
    </header>

    <!-- Remember to change these two links -->
    <iframe src="assets/" class="pdf-viewer" title="Buddy Collins Resume">
      <p>It appears your browser does not support embedded PDFs. 
         <a href="assets/">Click here to download the PDF.</a>
      </p>
    </iframe>
  </div>

</body>
</html>
